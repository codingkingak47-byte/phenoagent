<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhenoAgent | Live ECG Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            background-color: #0b0f19; /* Deep dark blue/gray for clinical feel */
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* Pulse animation for the heart rate icon */
        @keyframes pulse-heart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .animate-pulse-heart {
            animation: pulse-heart 0.8s infinite;
        }

        /* Medical Grid Background for the Chart */
        .ecg-grid {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
            background-position: -1px -1px, -1px -1px, -1px -1px, -1px -1px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col h-screen">

    <header class="glass-panel border-b border-gray-800 px-6 py-4 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <h1 class="text-2xl font-bold tracking-wider text-white">PHENO<span class="text-green-400">AGENT</span></h1>
        </div>
        <div class="flex items-center gap-6 text-sm text-gray-400">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span>Live Feed Active</span>
            </div>
            <div>Patient ID: <span class="text-white font-mono">PA-99321</span></div>
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 overflow-hidden">
        
        <!-- Left Column: Vitals -->
        <aside class="lg:col-span-1 flex flex-col gap-4 overflow-y-auto pr-2 pb-4">
            
            <!-- Heart Rate Panel -->
            <div class="glass-panel rounded-xl p-5 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10">
                    <svg class="w-24 h-24 text-green-500 animate-pulse-heart" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                <h3 class="text-gray-400 text-sm uppercase tracking-wider mb-1">Heart Rate</h3>
                <div class="flex items-baseline gap-2">
                    <span id="bpm-value" class="text-6xl font-bold text-green-400 font-mono">72</span>
                    <span class="text-gray-500 font-semibold">BPM</span>
                </div>
                <div class="mt-4 flex items-center justify-between">
                    <span class="text-xs px-2 py-1 bg-green-900/50 text-green-300 rounded-md border border-green-800">Normal</span>
                    <span class="text-xs text-gray-500">Limits: 60 - 100</span>
                </div>
            </div>

            <!-- Blood Pressure Panel -->
            <div class="glass-panel rounded-xl p-5">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider mb-1">Blood Pressure</h3>
                <div class="flex items-baseline gap-2">
                    <span id="bp-value" class="text-4xl font-bold text-blue-400 font-mono">120/80</span>
                    <span class="text-gray-500 font-semibold text-sm">mmHg</span>
                </div>
                <div class="mt-2 text-sm text-gray-400">
                    MAP: <span id="map-value" class="text-gray-200">93</span> mmHg
                </div>
            </div>

            <!-- SpO2 Panel -->
            <div class="glass-panel rounded-xl p-5">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider mb-1">SpO2</h3>
                <div class="flex items-baseline gap-2">
                    <span id="spo2-value" class="text-4xl font-bold text-yellow-400 font-mono">98</span>
                    <span class="text-gray-500 font-semibold text-sm">%</span>
                </div>
                <div class="w-full bg-gray-700 h-1 mt-3 rounded-full overflow-hidden">
                    <div class="bg-yellow-400 h-full w-[98%]"></div>
                </div>
            </div>

            <!-- Patient Status -->
            <div class="glass-panel rounded-xl p-5 flex-1 border border-gray-700 flex flex-col">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider mb-2">Analysis</h3>
                <div class="flex-1 flex items-center justify-center bg-gray-900/50 rounded-lg p-4 text-center">
                    <div>
                        <div class="text-green-400 font-semibold text-lg mb-1">Normal Sinus Rhythm</div>
                        <div class="text-gray-500 text-sm">No abnormalities detected. Continuous monitoring active.</div>
                    </div>
                </div>
            </div>

        </aside>

        <!-- Right Column: ECG Main Trace -->
        <section class="lg:col-span-3 flex flex-col gap-4 h-full min-h-[400px]">
            <div class="glass-panel rounded-xl p-2 flex-1 flex flex-col relative overflow-hidden">
                <div class="flex justify-between items-center p-2 mb-2 bg-gray-800/50 rounded-lg border border-gray-700">
                    <div class="flex gap-4">
                        <span class="text-green-400 font-semibold">Lead II</span>
                        <span class="text-gray-500 text-sm">25 mm/s</span>
                        <span class="text-gray-500 text-sm">10 mm/mV</span>
                    </div>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 text-xs bg-gray-700 hover:bg-gray-600 rounded text-gray-200 transition-colors">Freeze</button>
                        <button class="px-3 py-1 text-xs bg-gray-700 hover:bg-gray-600 rounded text-gray-200 transition-colors">Print</button>
                    </div>
                </div>
                
                <!-- The Chart Canvas -->
                <div class="flex-1 w-full relative ecg-grid rounded-lg border border-gray-800">
                    <canvas id="ecgCanvas" class="absolute inset-0 w-full h-full"></canvas>
                </div>
            </div>
            
            <!-- Secondary Trace (Optional/Mock) -->
            <div class="glass-panel rounded-xl p-4 h-32 flex flex-col justify-center opacity-60">
                <span class="text-blue-400 font-semibold text-sm mb-1">Pleth (SpO2)</span>
                <canvas id="plethCanvas" class="w-full h-16"></canvas>
            </div>
        </section>
    </main>

    <script>
        // Update Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Configuration
        const TOTAL_POINTS = 300; // Number of points visible on screen
        const UPDATE_INTERVAL = 30; // ms between updates (~33fps)
        
        // ECG Data Buffer
        let ecgData = Array(TOTAL_POINTS).fill(0);
        let currentIndex = 0;

        // Synthetic Heartbeat Template (P wave, QRS complex, T wave)
        const heartbeatTemplate = [
            0, 0, 0, 0, 0,
            0.1, 0.15, 0.1, 0, 0, // P wave
            0, 0, -0.1,          // PR segment & Q wave
            1.2, -0.4, 0,        // R & S waves (spike)
            0, 0, 0, 0, 0,       // ST segment
            0.1, 0.2, 0.25, 0.2, 0.1, 0, // T wave
            0, 0, 0, 0, 0, 0, 0, 0
        ];
        
        let templateIndex = 0;
        let isBeating = true;
        let currentBpm = 72;

        // Function to generate the next data point
        function getNextEcgValue() {
            let val = 0;
            
            if (isBeating) {
                if (templateIndex < heartbeatTemplate.length) {
                    val = heartbeatTemplate[templateIndex];
                    templateIndex++;
                } else {
                    // Wait for next beat based on BPM
                    const beatDurationMs = 60000 / currentBpm;
                    const pointsPerBeat = beatDurationMs / UPDATE_INTERVAL;
                    const restPoints = pointsPerBeat - heartbeatTemplate.length;
                    
                    if (templateIndex < heartbeatTemplate.length + restPoints) {
                        val = 0; // Baseline
                        templateIndex++;
                    } else {
                        templateIndex = 0; // Restart beat
                        simulateVitalsUpdate(); // Update numerical vitals slightly every beat
                    }
                }
            }
            
            // Add slight baseline wander and high-frequency noise
            const noise = (Math.random() - 0.5) * 0.05;
            const wander = Math.sin(Date.now() / 2000) * 0.05;
            
            return val + noise + wander;
        }

        const ctxEcg = document.getElementById('ecgCanvas').getContext('2d');
        
        // Main ECG Chart
        const ecgChart = new Chart(ctxEcg, {
            type: 'line',
            data: {
                labels: Array.from({length: TOTAL_POINTS}, (_, i) => i),
                datasets: [{
                    label: 'Lead II',
                    data: ecgData,
                    borderColor: '#4ade80', // Tailwind green-400
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.3,
                    borderJoinStyle: 'round',
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, // Turn off animations for performance
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                scales: {
                    x: { display: false }, // Hide x axis
                    y: { 
                        display: false,    // Hide y axis ticks
                        min: -1.0, 
                        max: 2.0 
                    }
                },
                layout: { padding: 0 }
            }
        });

        // Simple Plethysmograph (SpO2 wave) for secondary canvas
        const ctxPleth = document.getElementById('plethCanvas').getContext('2d');
        let plethData = Array(TOTAL_POINTS).fill(0);
        
        const plethChart = new Chart(ctxPleth, {
            type: 'line',
            data: {
                labels: Array.from({length: TOTAL_POINTS}, (_, i) => i),
                datasets: [{
                    data: plethData,
                    borderColor: '#60a5fa', // blue-400
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: { x: { display: false }, y: { display: false, min: -1, max: 2 } }
            }
        });

        // Animation Loop using requestAnimationFrame for smoother rendering
        let lastUpdateTime = 0;
        
        function updateCharts(timestamp) {
            if (timestamp - lastUpdateTime > UPDATE_INTERVAL) {
                // Generate new point
                const newPoint = getNextEcgValue();
                
                // Shift array left and push new point to end (scrolling effect)
                ecgData.shift();
                ecgData.push(newPoint);
                
                // Pleth wave is a smoother, delayed sine wave mimicking blood flow
                const plethVal = (Math.sin(Date.now() / 300) + Math.sin(Date.now() / 600)) * 0.5 + 0.5;
                plethData.shift();
                plethData.push(plethVal);

                // Update charts
                ecgChart.update();
                plethChart.update();
                
                lastUpdateTime = timestamp;
            }
            requestAnimationFrame(updateCharts);
        }
        
        // Start loop
        requestAnimationFrame(updateCharts);

        function simulateVitalsUpdate() {
            // Randomly fluctuate BPM by +/- 1 occasionally
            if (Math.random() > 0.7) {
                currentBpm += Math.floor(Math.random() * 3) - 1;
                // Clamp BPM
                if(currentBpm > 85) currentBpm = 85;
                if(currentBpm < 60) currentBpm = 60;
                document.getElementById('bpm-value').textContent = currentBpm;
            }

            // Occasional BP and SpO2 fluctuations
            if (Math.random() > 0.9) {
                const sys = 115 + Math.floor(Math.random() * 10);
                const dia = 75 + Math.floor(Math.random() * 10);
                document.getElementById('bp-value').textContent = `${sys}/${dia}`;
                document.getElementById('map-value').textContent = Math.round((sys + 2 * dia) / 3);
            }
            
            if (Math.random() > 0.95) {
                const spo2 = 97 + Math.floor(Math.random() * 3);
                document.getElementById('spo2-value').textContent = spo2;
            }
        }
    </script>
</body>
</html>
